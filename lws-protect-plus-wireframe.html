    const tierBtn = "min-height: 48px; border-radius: 4px; cursor: pointer; font: 600 16px system-ui; ";

    const FAQ = [
      { label: "Product", items: [["What is the difference between LWS Protect and LWS Protect+?", "Protect+ adds a separate physical panic button to app-based protection, designed for discreet activation where the phone may not be reachable when it is needed."]] },
      { label: "Device", items: [["How does the panic button work with the app?", "It is a Bluetooth panic button used alongside the LWS app on the worker’s smartphone."]] },
      { label: "Monitoring", items: [["Can we use our own responders?", "Yes. With self-monitoring, your organisation manages incoming alerts through its own designated responders."], ["Is 24/7 monitoring available?", "Yes. Alerts can be handled through LWS professional monitoring."]] },
      { label: "Deployment", items: [] },
      { label: "Pricing", items: [] }
    ];
    const tab = FAQ[s.faqTab];
    const tabBtn = "min-height: 44px; padding: 0 18px; border-radius: 3px; cursor: pointer; font: 600 15px system-ui; ";

    return {
      checks: checks, meter: meter, result: result,
      monOpts: MON.map((o, i) => ({
        eyebrow: o.eyebrow, title: o.title, pressed: s.mon === i ? "true" : "false",
        style: monBtn + (s.mon === i ? "background: #ffffff; color: #1a1a1a; border: 2px solid #1a1a1a;" : "background: #fbfbfa; color: #5a5a56; border: 1px solid #d5d5d2;"),
        radio: s.mon === i ? "border: 7px solid #1a1a1a; box-sizing: border-box;" : "border: 1.5px solid #9a9a95; box-sizing: border-box;",
        pick: () => set({ mon: i })
      })),
      mon: { title: m.title, tag: m.tag, foot: m.foot, rows: m.rows.map((r) => ({ q: r[0], a: r[1] })), choose: () => set({ pMon: s.mon }) },
      inds: IND.map((x, i) => ({
        name: x.name, pressed: s.ind === i ? "true" : "false",
        style: indBtn + (i ? "border-left: 1px solid #e2e2df; " : "") + (s.ind === i ? "background: #1a1a1a; color: #ffffff;" : "background: #ffffff; color: #1a1a1a;"),
        pick: () => set({ ind: i })
      })),
      ind: { name: ind.name, env: ind.env, challenge: ind.challenge, help: ind.help, img: "CONTEXT IMAGE — " + ind.name.toUpperCase() },
      showFull: s.full, fullExpanded: s.full ? "true" : "false",
      fullLabel: s.full ? "Hide Full Comparison ↑" : "View Full Comparison ↓",
      toggleFull: () => set({ full: !s.full }),
      priceMon: PMON.map((l, i) => ({
        label: l, pressed: s.pMon === i ? "true" : "false",
        style: segBtn + (s.pMon === i ? "background: #1a1a1a; color: #ffffff;" : "background: #ffffff; color: #3a3a37;") + (i ? " border-left: 1px solid #1a1a1a;" : ""),
        pick: () => set({ pMon: i })
      })),
      priceTier: TIERS.map((l, i) => ({
        label: l, pressed: s.pTier === i ? "true" : "false",
        style: tierBtn + (s.pTier === i ? "background: #1a1a1a; color: #ffffff; border: 1px solid #1a1a1a;" : "background: #ffffff; color: #1a1a1a; border: 1px solid #c9c9c5;"),
        pick: () => set({ pTier: i })
      })),
      price: { amount: "[PRICE]", summary: PMON[s.pMon] + " · " + TIERS[s.pTier] + " users" },
      faqTabs: FAQ.map((t, i) => ({
        label: t.label, count: String(t.items.length), pressed: s.faqTab === i ? "true" : "false",
        style: tabBtn + (s.faqTab === i ? "background: #1a1a1a; color: #ffffff; border: 1px solid #1a1a1a;" : "background: #ffffff; color: #1a1a1a; border: 1px solid #c9c9c5;"),
        pick: () => set({ faqTab: i, faqOpen: 0 })
      })),
      faqs: tab.items.map((f, i) => ({
        q: f[0], a: f[1], open: s.faqOpen === i, expanded: s.faqOpen === i ? "true" : "false", sign: s.faqOpen === i ? "\u2212" : "+",
        toggle: () => set({ faqOpen: s.faqOpen === i ? -1 : i })
      })),
      faqEmpty: tab.items.length === 0
    };
  }
}

const comp = new Component({});
const tpl = document.getElementById('tpl');
const mount = document.getElementById('app');
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function look(path, scope){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  const parts = path.split('.'); let v = scope;
  for (const p of parts){ if (v == null) return undefined; v = v[p]; }
  return v;
}
function whole(str){ const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str); return m ? m[1] : null; }
function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
function renderNode(n, scope, out){
  if (n.nodeType === 3){ out.push(document.createTextNode(interp(n.nodeValue, scope))); return; }
  if (n.nodeType !== 1) return;
  const tag = n.localName;
  if (tag === 'sc-for'){
    const list = look(whole(n.getAttribute('list')), scope) || [];
    const as = n.getAttribute('as') || 'item';
    list.forEach((item, idx) => { const sc = Object.create(scope); sc[as] = item; sc.$index = idx; n.childNodes.forEach(c => renderNode(c, sc, out)); });
    return;
  }
  if (tag === 'sc-if'){ if (look(whole(n.getAttribute('value')), scope)) n.childNodes.forEach(c => renderNode(c, scope, out)); return; }
  const el = n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(n.namespaceURI, n.tagName) : document.createElement(tag);
  for (const a of n.attributes){
    const w = whole(a.value);
    if (a.name.startsWith('on') && w){ const fn = look(w, scope); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue; }
    if (a.name.startsWith('hint-')) continue;
    el.setAttribute(a.name, interp(a.value, scope));
  }
  const kids = []; n.childNodes.forEach(c => renderNode(c, scope, kids)); kids.forEach(k => el.appendChild(k));
  out.push(el);
}
function render(){
  const vals = comp.renderVals(); const out = [];
  tpl.content.childNodes.forEach(c => renderNode(c, vals, out));
  mount.replaceChildren(...out);
}
render();
</script>
